<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Pengguna</title>
  <script>
    function confirmDelete(url) {
      if (confirm("Anda yakin ingin menghapus pengguna ini?")) {
        window.location.href = url;
      }
    }
  </script>
</head>
<body>
  <h1>Daftar Pengguna</h1>
  <table>
    <tr>
      <th>No</th>
      <th>User ID</th>
      <th>Nama</th>
      <th>Username</th>
      <th>Password</th>
      <th>Level</th>
      <th>Email</th>
    </tr>
    {% for i in range(users|length) %}
    <tr>
      <td>{{ i + 1 }}</td>
      <td>{{ users[i][1] }}</td>
      <td>{{ users[i][2] }}</td>
      <td>{{ users[i][3] }}</td>
      <td>{{ users[i][4] }}</td>
      <td>{{ users[i][5] }}</td>
      <td>{{ users[i][6] }}</td>
      <td>
        <a href="{{ url_for('users_bp.edit_user', user_id=users[i][0]) }}">Edit</a>
        <a href="{{ url_for('users_bp.delete_user', user_id=users[i][0]) }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
