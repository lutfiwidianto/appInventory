<!DOCTYPE html>
<html lang="en">

<head>
  <title>Login App</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Fon Goolge-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='plugins/fontawesome-free/css/all.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='loginCss/style.css') }}">
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    .prifix_loading_box {
      position: relative;
      width: 200px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }

    .prifix_loading_box span {
      display: block;
      height: 20px;
      width: 20px;
      background: #000;
      border-radius: 50%;
      animation: all-effect 0.6s linear infinite alternate;
      transform: scale(0);
    }

    .prifix_loading_box span:nth-child(1) {
      animation-delay: 0.1s;
    }

    .prifix_loading_box span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .prifix_loading_box span:nth-child(3) {
      animation-delay: 0.3s;
    }

    .prifix_loading_box span:nth-child(4) {
      animation-delay: 0.4s;
      background: #76f84e;
    }

    .prifix_loading_box span:nth-child(5) {
      animation-delay: 0.5s;
      background: #76f84e;
    }

    @keyframes all-effect {
      100% {
        transform: scale(1);
      }
    }

    .form-control:focus {
      box-shadow: 0 0 5px rgba(54, 122, 11, 0.2);
      border-color: #76f84e;
    }

    /* Add this CSS for full-screen overlay */
    .modal-fullscreen {
      display: flex !important;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
    }

    .modal-fullscreen .modal-content {
      width: 100%;
      max-width: none;
      background: none;
      border: none;
      box-shadow: none;
    }
  </style>
</head>

<body>
  <section class="ftco-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-12 col-lg-12">

          <div class="wrap d-md-flex">

            <div class="kiri-wrap p-4 p-md-5 d-flex flex-column justify-content-center align-items-center">
              <h3 class="text-center" style="margin-bottom: 22px ;"><b>SELAMAT DATANG KEMBALI !</b></h3>
              <h5 class="text-center" style="margin-bottom: 0px ;"><b>'APP IT INVENTORY'</b></h5>
              <p class="h6 text-center" style="margin-bottom:7px ;">Make sure your aplication is scure</p>
              <img src="{{ url_for('static', filename='img/people1.png') }}" class="img-fluid" alt="Sample image"
                style="width:80%; height:60%; margin-bottom:20px;">
            </div>
            <div class="login-wrap p-4 p-md-5">
              <!-- tambahkan alert di sini -->
              <br><br>
              <div class="text-center">
                <br>
                <img src="{{ url_for('static', filename='img/tct_logo.png') }}" class="img-fluid" alt="Sample image"
                  style="width:20%; height:auto;">
              </div>
              <h5 class="text-center">PT TUNG CHIA TEKNOLOGY</h5>
              <br>

              <P>Silahkan masuk menggunakan username dan passwod anda.</P>
              <div class="d-flex">
              </div>
              <div style="display: flex; justify-content: center; align-items: center; text-align: center;">
                <div class="prifix_loading_box" id="loadingBox" style="display: none;"> <span></span> <span></span>
                  <span></span> <span></span> <span></span> </div>
              </div>
              <div class="alert alert-danger" role="alert" id="loginAlert" style="display: none; height: 50px;">
                Login gagal.
              </div>
              <form class="signin-form" id="login-form">

                <div class="form-group mb-3">
                  <div class="input-group">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Username"
                      required>
                    <div class="input-group-append">
                      <span class="input-group-text bg-white"><i class="fas fa-user"></i></span>
                    </div>
                  </div>
                </div>
                <div class="form-group mb-3">
                  <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Password"
                      required>
                    <div class="input-group-append">
                      <span class="input-group-text bg-white"><i class="fas fa-lock"></i></span>
                    </div>
                  </div>
                </div>

                <div class="form-group d-md-flex">
                  <div class="w-50 text-left">
                    <label class="checkbox-wrap checkbox-primary mb-0">
                      <input type="checkbox" id="remember_me" name="remember_me" value="true">
                      <span class="checkmark"></span>
                      Ingat saya
                    </label>
                  </div>
                  <div class="w-50 text-md-right">
                    <a href="https://wa.me/6285855955336?text=Username%3A%20%3Cmasukkan username anda%3E%0APassword%20Baru%3A%20%3Cganti dengan password baru yang anda inginkan%3E&phone=6287863516069"
                      target="_blank">Lupa Password</a>
                  </div>
                </div>

                <div class="form-group">
                  <button type="submit" class="form-control btn btn-primary rounded submit px-3" id="login-btn">LOGIN
                  </button>
                </div>
              </form>

              <p class="text-center">Bukan member? <a data-toggle="tab" href="#signup">Daftar</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Add this modal structure at the end of your body section -->

  </section>
  <script src="{{ url_for('static', filename='jquery/jquery-3.6.0.min.js') }}"></script>
  <script src="{{ url_for('static', filename='plugins/login/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='plugins/login/popper.js') }}"></script>
  <script src="{{ url_for('static', filename='bootstrap/bootstrap.min.js') }}"></script>
  <script src="{{ url_for('static', filename='plugins/login/main.js') }}"></script>
  <!-- Library enskripsi password yang diremember-->
  <script src="{{ url_for('static', filename='crypto-js/crypto-js.min.js') }}"></script>
  <script>
    // Function untuk mengambil data form login
    const form = document.getElementById("login-form");
    const alert = document.getElementById("loginAlert");
    const loadingBox = document.getElementById("loadingBox");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      // Show loading box
      loadingBox.style.display = "flex";

      // Get username and password from the form
      const username = form.elements.username.value;
      const password = form.elements.password.value;

      // Log username and password to console
      // console.log(username);
      // console.log(password);

      // Clear previous error messages
      alert.innerHTML = "";
      alert.style.display = "none";

      // Send login request to the server
      fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json;charset=UTF-8" },
        body: JSON.stringify({ username, password }),
      })
        .then((response) => response.json())
        .then((data) => {
          if (data.success) {
            // Redirect to dashboard if login successful
            window.location.href = "/dashboard";
          } else {
            // Show loading box
            loadingBox.style.display = "flex";

            // Delay for a certain period (e.g., 3 seconds)
            setTimeout(() => {
              // Show error message if login failed
              alert.innerHTML = data.message;
              alert.style.display = "block";
              // Hide loading box
              loadingBox.style.display = "none";
              // Hide the alert after 5 seconds
              setTimeout(() => {
                alert.innerHTML = "";
                alert.style.display = "none";

              }, 5000);
            }, 2000);
          }
        })
        .catch((error) => {
          console.error(error);
          // Hide loading box in case of an error
          loadingBox.style.display = "none";
        });
    });



    window.onload = function () {
      // Jika informasi login pengguna telah tersimpan di localStorage, set opsi remember_me ke true
      if (localStorage.getItem("username") !== null && localStorage.getItem("password") !== null) {
        $('#remember_me').prop('checked', true);
      }

      // Saat halaman selesai dimuat, cek apakah opsi remember_me telah dipilih sebelumnya
      if (localStorage.getItem("remember_me") == "true") {
        // Jika opsi remember_me telah dipilih sebelumnya, tampilkan data login pengguna pada kolom username dan password
        $('#username').val(localStorage.getItem("username"));
        var decryptedPassword = CryptoJS.AES.decrypt(localStorage.getItem("password"), "secret key").toString(CryptoJS.enc.Utf8);
        $('#password').val(decryptedPassword);
        $('#remember_me').prop('checked', true);
      }


    }

    // Jalankan script berikut ketika halaman selesai dimuat
    $(document).ready(function () {

      document.addEventListener('contextmenu', event => event.preventDefault());

      // Saat halaman selesai dimuat, cek apakah opsi remember_me telah dipilih sebelumnya
      if (localStorage.getItem("remember_me") == "true") {
        // Jika opsi remember_me telah dipilih sebelumnya, tampilkan data login pengguna pada kolom username dan password
        $('#username').val(localStorage.getItem("username"));
        $('#password').val(localStorage.getItem("password"));
        $('#remember_me').attr('checked', true);
      }



      // Jalankan script berikut ketika form login disubmit
      $('.signin-form').submit(function () {
        // Jika opsi remember_me dipilih, simpan informasi login pengguna pada localStorage
        if ($('[name="remember_me"]').is(':checked')) {
          var encryptedPassword = CryptoJS.AES.encrypt($('#password').val(), "secret key").toString();
          localStorage.setItem("username", $('#username').val());
          localStorage.setItem("password", encryptedPassword);
          localStorage.setItem("remember_me", "true");
        } else {
          // Jika opsi remember_me tidak dipilih, hapus informasi login pengguna dari localStorage
          localStorage.removeItem("username");
          localStorage.removeItem("password");
          localStorage.setItem("remember_me", "false");
        }
      });

      // Saat halaman selesai dimuat, cek apakah opsi remember_me telah dipilih sebelumnya
      if (localStorage.getItem("remember_me") == "true") {
        // Jika opsi remember_me telah dipilih sebelumnya, tampilkan data login pengguna pada kolom username dan password
        $('#username').val(localStorage.getItem("username"));
        var decryptedPassword = CryptoJS.AES.decrypt(localStorage.getItem("password"), "secret key").toString(CryptoJS.enc.Utf8);
        $('#password').val(decryptedPassword);
        $('#remember_me').prop('checked', true);
      }

      // Jalankan script berikut ketika opsi remember_me di klik
      $('#remember_me').click(function () {
        // Jika opsi remember_me tidak dipilih, hapus informasi login pengguna dari localStorage
        if (!$(this).is(':checked')) {
          localStorage.removeItem("username");
          localStorage.removeItem("password");
        }
      });
    });
  </script>

</body>

</html>
