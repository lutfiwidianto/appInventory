<!DOCTYPE html>
<html>
<head>
  <title>Contoh Form Modal dengan Tombol Tambah dan Edit</title>
  <!-- Tambahkan jQuery dan Bootstrap CSS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Tambahkan Bootstrap JavaScript -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
  <!-- Tombol untuk membuka modal 'Tambah' -->
  <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal" data-mode="add">Tambah</button>

  <!-- Tombol untuk membuka modal 'Edit' -->
  <button type="button" class="btn btn-warning" data-toggle="modal" data-target="#myModal" data-mode="edit">Edit</button>

  <!-- Modal Tambah/Edit -->
  <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="myModalLabel">Tambah/Edit Data</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="myForm">
            <div class="form-group">
              <label for="nama">Nama</label>
              <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama">
            </div>
            <div class="form-group">
              <label for="alamat">Alamat</label>
              <textarea class="form-control" id="alamat" name="alamat" rows="3"></textarea>
            </div>
            <!-- Tombol Submit untuk Tambah Data -->
            <button type="submit" class="btn btn-primary" id="submitTambah" style="display:none">Tambah Data</button>
            <!-- Tombol Submit untuk Edit Data -->
            <button type="submit" class="btn btn-warning" id="submitEdit" style="display:none">Edit Data</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript untuk mengatur tampilan tombol Submit -->
  <script>
    $(document).ready(function() {
  $('#myModal').on('show.bs.modal', function(event) {
    var button = $(event.relatedTarget) // Tombol yang mengaktifkan modal
    var mode = button.data('mode'); // Mengambil mode dari atribut data-mode pada tombol

    // Menentukan judul modal berdasarkan mode
    if (mode == 'add') {
      $('.modal-title').text('Tambah Data');
      $('#submitTambah').show();
      $('#submitEdit').hide();
    } else if (mode == 'edit') {
      $('.modal-title').text('Edit Data');
      $('#submitTambah').hide();
      $('#submitEdit').show();
    }
  });
});

  </script>
</body>
</html>
